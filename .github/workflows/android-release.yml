name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_CHANNEL: "stable"
  EXPORT_PRESET: "Android"
  OUTPUT_APK: "builds/android/micro_farm_manager.apk"

jobs:
  export-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build UpdateInstaller Android plugin
        run: |
          chmod +x build/ci/build-update-plugin.sh
          build/ci/build-update-plugin.sh

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          DOWNLOAD_TAG="${GODOT_VERSION}-${GODOT_CHANNEL}"
          TEMPLATE_DIR="${GODOT_VERSION}.${GODOT_CHANNEL}"
          BASE="Godot_v${DOWNLOAD_TAG}"
          wget -q "https://github.com/godotengine/godot/releases/download/${DOWNLOAD_TAG}/${BASE}_linux.x86_64.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${DOWNLOAD_TAG}/${BASE}_export_templates.tpz"
          unzip -q "${BASE}_linux.x86_64.zip"
          sudo mv "${BASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p "${HOME}/.local/share/godot/export_templates/${TEMPLATE_DIR}"
          cp "${BASE}_export_templates.tpz" /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "${HOME}/.local/share/godot/export_templates/${TEMPLATE_DIR}/"
          godot --version

      - name: Apply release version metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="ci-${GITHUB_RUN_NUMBER}"
          fi
          sed -i "s|^version/name=.*|version/name=\"${VERSION_NAME}\"|" export_presets.cfg
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i "s|^config/version=.*|config/version=\"${VERSION_NAME}\"|" project.godot
          sed -i "s|^config/version_code=.*|config/version_code=${GITHUB_RUN_NUMBER}|" project.godot

      - name: Export signed Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/keystore/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/keystore/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          chmod +x build/ci/export-android.sh
          build/ci/export-android.sh

      - name: Publish version.json for in-app updates
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          mkdir -p build/pages
          cat > build/pages/version.json <<EOF
          {
            "version": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "apkName": "micro_farm_manager.apk",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION_NAME}/micro_farm_manager.apk",
            "fallbackUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/apk/micro_farm_manager.apk"
          }
          EOF

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_APK }}
          generate_release_notes: true

      - name: Update latest APK alias
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Latest APK
          prerelease: true
          make_latest: false
          files: ${{ env.OUTPUT_APK }}
          body: |
            Latest Micro Farm Manager APK: ${{ github.ref_name }} (build ${{ github.run_number }})

            Versioned file: [micro_farm_manager.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/micro_farm_manager.apk)

            Install over an existing sideload copy to keep your save.

      - name: Publish version.json branch
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          WORKDIR="$(mktemp -d)"
          cp build/pages/version.json "${WORKDIR}/version.json"
          cp build/pages/index.html "${WORKDIR}/index.html"
          cd "${WORKDIR}"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html
          git commit -m "Publish version.json for v${VERSION_NAME}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload CI artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: micro-farm-manager-android
          path: ${{ env.OUTPUT_APK }}
